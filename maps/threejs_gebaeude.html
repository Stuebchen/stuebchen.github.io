<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoJSON-Extrusion (Three.js)</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e7f3ee; }
    @media (prefers-color-scheme: dark) { html, body { background: #161514; } }
    canvas { display: block; }
    #info {
      position: absolute;
      left: 0.75rem;
      bottom: 0.75rem;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.85);
      color: #1c1917;
      font: 0.8125rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">Ziehen zum Drehen · Scrollen zum Zoomen</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const dark = matchMedia('(prefers-color-scheme: dark)').matches;

    // ---------- Szene, Kamera, Renderer ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(dark ? 0x161514 : 0xe7f3ee);
    scene.fog = new THREE.Fog(scene.background, 400, 900);

    const camera = new THREE.PerspectiveCamera(45, 1, 1, 2000);
    camera.position.set(180, 160, 220);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.maxPolarAngle = Math.PI / 2.1;   // nicht unter den Boden schauen
    controls.addEventListener('start', () => { controls.autoRotate = false; });

    // ---------- Licht ----------
    scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x222222 : 0xb9d9cc, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(-150, 250, 120);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 1, far: 700 });
    scene.add(sun);

    // ---------- Boden ----------
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(1200, 1200),
      new THREE.MeshStandardMaterial({ color: dark ? 0x23221f : 0xf5f5f4 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(1200, 60, 0x20b581, dark ? 0x34322f : 0xd6d3d1);
    grid.position.y = 0.05;
    scene.add(grid);

    // ---------- GeoJSON einlesen und extrudieren ----------
    const data = await fetch('../assets/gebaeude_beispiel.geojson').then(r => r.json());

    // Mittelpunkt aller Koordinaten als lokaler Ursprung
    const coords = data.features.flatMap(f => f.geometry.coordinates[0]);
    const lon0 = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    const lat0 = coords.reduce((s, c) => s + c[1], 0) / coords.length;
    const mPerDegLon = 111320 * Math.cos(lat0 * Math.PI / 180);
    const mPerDegLat = 110540;

    // Längen-/Breitengrad → lokale Meter (einfache äquidistante Projektion)
    const project = ([lon, lat]) => new THREE.Vector2((lon - lon0) * mPerDegLon, (lat - lat0) * mPerDegLat);

    const heights = data.features.map(f => f.properties.hoehe_m);
    const hMin = Math.min(...heights), hMax = Math.max(...heights);
    const low = new THREE.Color(dark ? 0x3a4a44 : 0xd8efe6);
    const high = new THREE.Color(0x20b581);

    const buildings = new THREE.Group();
    for (const feature of data.features) {
      const shape = new THREE.Shape(feature.geometry.coordinates[0].map(project));
      const height = feature.properties.hoehe_m;
      const geometry = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
      // Extrusion zeigt in +Z – drehen, damit sie nach oben (+Y) zeigt
      geometry.rotateX(-Math.PI / 2);

      const t = (height - hMin) / (hMax - hMin || 1);
      const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({
        color: low.clone().lerp(high, t),
        roughness: 0.7
      }));
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = feature.properties;
      buildings.add(mesh);
    }
    scene.add(buildings);

    // ---------- Wachstums-Animation beim Start ----------
    buildings.scale.y = 0.001;
    const start = performance.now();

    // ---------- Hover: Name und Höhe anzeigen ----------
    const info = document.getElementById('info');
    const defaultInfo = info.textContent;
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;

    renderer.domElement.addEventListener('pointermove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(buildings.children)[0];
      if (hovered) hovered.material.emissive.setHex(0x000000);
      hovered = hit ? hit.object : null;
      if (hovered) {
        hovered.material.emissive.setHex(0x0b3d2b);
        info.textContent = `${hovered.userData.name} · ${hovered.userData.hoehe_m} m`;
      } else {
        info.textContent = defaultInfo;
      }
    });

    // ---------- Render-Schleife (passt Größe an, z. B. im iframe) ----------
    function resize() {
      const w = innerWidth, h = innerHeight;
      if (renderer.domElement.width !== Math.floor(w * renderer.getPixelRatio()) ||
          renderer.domElement.height !== Math.floor(h * renderer.getPixelRatio())) {
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    renderer.setAnimationLoop((now) => {
      resize();
      const p = Math.min((now - start) / 1500, 1);
      buildings.scale.y = 0.001 + (1 - Math.pow(1 - p, 3)) * 0.999;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
